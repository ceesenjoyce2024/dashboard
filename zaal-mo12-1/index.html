<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1a2b">
<title>Zaalcompetitie MO12-1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0d1a2b; --card:#15253b; --card2:#1c304b; --line:#253d5e;
  --tx:#eef3f9; --mut:#9db0c8; --or:#ff6b1a; --or2:#ff8a47; --lb:#8fc6ee; --navy:#0b2341;
  --court:#0a6fd6; --ok:#3ccf7a; --bad:#ff5c5c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:12px}
.crest{width:42px;height:42px;border-radius:50%;background:var(--navy);border:3px solid var(--or);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--lb);flex:none}
.ttl b{display:block;font-size:18px}.ttl span{font-size:13px;color:var(--mut)}
.comp{background:var(--card);border:1.5px solid var(--or);border-radius:16px;padding:10px 14px;margin:4px 0 12px;display:flex;gap:10px;align-items:center}
.comp .klasse{background:rgba(255,107,26,.16);color:var(--or2);font-weight:700;font-size:13px;padding:2px 9px;border-radius:999px}
.comp .poule{color:var(--mut);font-size:14px}
.banner{background:#2a2412;border:1px solid #6b5420;color:#f3d48a;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
h2.day{font-size:20px;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2.day small{font-size:12px;font-weight:600;color:var(--mut);background:var(--card);padding:3px 9px;border-radius:999px}
.card{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 34px 64px 34px 1fr 14px;align-items:center;gap:8px;padding:13px 12px;border:0;background:none;width:100%;text-align:left;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row .h{text-align:right;font-size:15px}.row .a{font-size:15px}
.row .t{text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.row .t.score{color:var(--or2)}
.row.ros{background:linear-gradient(90deg,rgba(255,107,26,.13),transparent 60%)}
.row.ros::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--or)}
.row .chev{color:var(--mut)}
.row .me{font-weight:700}
.badge{width:34px;height:34px;border-radius:50%;background:#fff;color:#16263d;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:-.2px}
.badge.r{background:var(--navy);color:var(--lb);box-shadow:0 0 0 2.5px var(--or)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-size:14px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--card2);color:var(--tx)}
.seg.t1 button.on.b1{background:var(--lb);color:var(--navy)}
.seg.t2 button.on.b2{background:var(--or);color:#fff}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
nav.bot div{display:flex;background:var(--card);border-radius:999px;padding:5px;gap:2px;box-shadow:0 6px 24px #0008;max-width:540px;width:100%}
nav.bot button{flex:1;border:0;background:none;border-radius:999px;padding:7px 2px 6px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bot button svg{width:21px;height:21px}
nav.bot button.on{background:var(--card2);color:var(--or2)}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th{color:var(--mut);font-weight:600;text-align:center;padding:10px 4px;font-size:13px}
table.st td{padding:11px 4px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.st td.tn{text-align:left;display:flex;align-items:center;gap:9px}
table.st th:nth-child(2){text-align:left}
table.st tr.me td{color:var(--or2);font-weight:700}
.muted{color:var(--mut);font-size:13px}
.pad{padding:12px 14px}
.sec{font-size:15px;font-weight:700;margin:20px 4px 8px}
/* beschikbaarheid */
.grid{overflow-x:auto}
.grid table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.grid th{color:var(--mut);font-weight:600;padding:8px 3px;text-align:center;white-space:nowrap;font-size:11.5px}
.grid th:first-child,.grid td:first-child{text-align:left;position:sticky;left:0;background:var(--card);padding-left:12px;z-index:1}
.grid td{padding:4px 2px;text-align:center;border-top:1px solid var(--line)}
.grid td.nm{font-weight:600;font-size:13.5px;white-space:nowrap}
.pos{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:5px;vertical-align:1px}
.pos.V{background:#13385f;color:var(--lb)}.pos.M,.pos.A,.pos.MA{background:#4a2410;color:var(--or2)}.pos.K{background:#2d3a1a;color:#b8e07a}
.cell{width:34px;height:30px;border-radius:9px;border:0;font-size:12px;font-weight:700}
.cell.ja{background:rgba(60,207,122,.16);color:var(--ok)}
.cell.nee{background:rgba(255,92,92,.16);color:var(--bad)}
.cell.w1,.cell.w2{background:rgba(255,190,60,.16);color:#ffc95a}
.cell:disabled{opacity:.55;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);padding:10px 12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:16px;height:12px;border-radius:4px;display:inline-block}
/* speeltijd */
.pl{display:grid;grid-template-columns:96px 1fr 60px;gap:10px;align-items:center;padding:10px 12px}
.pl+.pl{border-top:1px solid var(--line)}
.pl .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:14px;background:var(--card2);border-radius:7px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--or)}.bar .p{background:var(--lb);opacity:.75}
.pl .m{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.pl .sub{grid-column:2/4;font-size:12px;color:var(--mut);margin-top:-6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stats div{background:var(--card);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stats span{font-size:12px;color:var(--mut)}
/* wedstrijd */
.mhead{background:var(--card);border-radius:18px;padding:14px;margin-top:6px}
.mhead .meta{font-size:13px;color:var(--mut);text-align:center}
.mhead .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:10px}
.mhead .vs .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;text-align:center}
.mhead .vs .sc{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--or2)}
.mhead .vs .sc.leeg{color:var(--mut);font-size:20px}
.back{border:0;background:var(--card);border-radius:999px;padding:7px 14px 7px 10px;font-size:14px;color:var(--mut)}
.court{position:relative;margin:10px auto 0;max-width:320px}
.court svg{display:block;width:100%;height:auto}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0}
.tok i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;box-shadow:0 2px 8px #0006;border:2.5px solid #fff}
.tok b{font-size:12.5px;background:#0b2341e6;padding:1px 7px;border-radius:7px;white-space:nowrap}
.tok.t1 i{background:var(--lb);color:var(--navy)}
.tok.t2 i{background:var(--or);color:#fff}
.tok.k i{background:#b8e07a;color:#1d2a0c}
.tok.sel i{outline:3px solid #ffe066;outline-offset:2px}
.tok .d{font-size:10px;color:#ffe066}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
.chip{background:var(--card2);border-radius:999px;padding:5px 11px;font-size:13px;border:0}
.chip.weg{color:var(--bad);background:rgba(255,92,92,.12)}
.chip.sel{outline:2px solid #ffe066}
.tl{padding:12px}
.tl .hl{font-size:12px;color:var(--mut);margin:8px 0 4px}
.tl .seq{display:flex;gap:3px}
.tl .seq div{border-radius:7px;padding:6px 4px;font-size:12px;font-weight:700;text-align:center}
.tl .seq .s1{background:var(--lb);color:var(--navy)}.tl .seq .s2{background:var(--or);color:#fff}
.tl .seq small{display:block;font-weight:500;font-size:10.5px;opacity:.85}
.warn{background:rgba(255,190,60,.12);color:#ffc95a;border-radius:12px;padding:8px 12px;font-size:13px;margin-top:8px}
.btn{border:0;background:var(--or);color:#fff;font-weight:700;border-radius:12px;padding:10px 14px;font-size:14px}
.btn.sec2{background:var(--card2);color:var(--tx)}
.btn.sm{padding:7px 11px;font-size:13px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input.in,select.in{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:15px;width:100%}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.sw+.sw{border-top:1px solid var(--line)}
.sw small{display:block;color:var(--mut);font-size:12.5px}
.tg{width:50px;height:30px;border-radius:999px;background:var(--card2);border:0;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--or)}.tg.on::after{left:23px}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 4px}
.scorein{display:grid;grid-template-columns:1fr 70px 16px 70px 1fr;gap:8px;align-items:center;margin:16px 0}
.scorein input{text-align:center;font-size:24px;font-weight:800}
.scorein .h{text-align:right;font-size:14px}.scorein .a{font-size:14px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.opts button{border:0;background:var(--card2);border-radius:12px;padding:11px 12px;text-align:left;font-size:15px;display:flex;justify-content:space-between}
.opts button small{color:var(--mut)}
.hide{display:none!important}
.fl{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="crest">ROS</div>
    <div class="ttl"><b>Zaalcompetitie MO12-1</b><span>MHC Rosmalen · Meisjes O12 Zaal</span></div>
  </header>
  <div class="comp"><span class="klasse">1e klasse</span><span class="poule">Zuid Nederland · Poule B</span></div>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<nav class="bot"><div id="nav"></div></nav>
<div id="sheet"></div>

<script>
/* =====================================================================
   DATA — poule B, 8 speeldagen, 42 wedstrijden (bron: KNHB Match Center)
   ===================================================================== */
const TEAMS={
  BAS:{n:"Basko",k:"BAS"}, EHV:{n:"Eindhoven",k:"EHV"}, MOP:{n:"MOP",k:"MOP"}, OSS:{n:"Oss",k:"OSS"},
  DB:{n:"Den Bosch",k:"DB"}, ROS:{n:"Rosmalen",k:"ROS"}, TIL:{n:"Tilburg",k:"TIL"}
};
const WIJ="ROS";
const DAGEN=[
  {d:1,datum:"2026-12-06",w:[["DB","OSS","13:30"],["OSS","MOP","14:20"],["ROS","BAS","15:00"],["DB","MOP","15:10"],["EHV","BAS","15:50"],["ROS","EHV","16:40"]]},
  {d:2,datum:"2026-12-13",w:[["EHV","MOP","09:15"],["MOP","DB","10:05"],["EHV","DB","10:55"],["OSS","BAS","15:00"],["TIL","BAS","15:50"],["OSS","TIL","16:40"]]},
  {d:3,datum:"2026-12-20",w:[["MOP","OSS","13:30"],["TIL","DB","14:00"],["BAS","OSS","14:20"],["DB","ROS","14:50"],["MOP","BAS","15:10"],["TIL","ROS","15:40"]]},
  {d:4,datum:"2027-01-10",w:[["BAS","TIL","09:00"],["DB","TIL","09:50"],["BAS","DB","10:40"]]},
  {d:5,datum:"2027-01-17",w:[["EHV","TIL","09:15"],["TIL","OSS","10:05"],["EHV","OSS","10:55"],["BAS","ROS","11:30"],["ROS","MOP","12:20"],["BAS","MOP","13:10"]]},
  {d:6,datum:"2027-01-24",w:[["MOP","ROS","08:30"],["ROS","TIL","09:20"],["MOP","TIL","10:10"],["DB","EHV","14:00"],["BAS","EHV","14:50"],["DB","BAS","15:40"]]},
  {d:7,datum:"2027-01-31",w:[["TIL","MOP","11:30"],["MOP","EHV","12:20"],["ROS","DB","13:00"],["TIL","EHV","13:10"],["OSS","DB","13:50"],["ROS","OSS","14:40"]]},
  {d:8,datum:"2027-02-14",w:[["OSS","EHV","12:30"],["EHV","ROS","13:20"],["OSS","ROS","14:10"]]}
];
const WED=[]; DAGEN.forEach(dg=>dg.w.forEach(([h,a,t],i)=>WED.push({id:`d${dg.d}-${i+1}`,dag:dg.d,datum:dg.datum,h,a,t})));
const RW=WED.filter(m=>m.h===WIJ||m.a===WIJ);           // onze 12 wedstrijden, chronologisch
RW.forEach((m,i)=>{m.nr=i+1; m.ihDag=RW.filter(x=>x.dag===m.dag).indexOf(m);});
const RDAGEN=[...new Set(RW.map(m=>m.dag))];             // speeldagen waarop wij spelen
const tegen=m=>m.h===WIJ?m.a:m.h;

const MAANDEN=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const fdat=(s,lang)=>{const[y,mm,dd]=s.split("-").map(Number);return lang?`Zondag ${String(dd).padStart(2,"0")} ${MAANDEN[mm-1]} ${y}`:`${dd} ${MAANDEN[mm-1]}`};

/* Formaties: slots per team, met groep en positie op het veld (% breedte, % hoogte; eigen doel onder) */
const FORM={
  huis:{naam:"Huis",slots:[
    {g:"V",l:"V1",x:24,y:75},{g:"V",l:"V2",x:76,y:75},
    {g:"M",l:"M1",x:20,y:51},{g:"M",l:"M2",x:80,y:51},
    {g:"A",l:"A",x:50,y:27}]},
  dobbel:{naam:"Dobbelsteen-Huis",slots:[
    {g:"V",l:"V1",x:24,y:75},{g:"V",l:"V2",x:76,y:75},
    {g:"M",l:"M",x:50,y:52},
    {g:"A",l:"A1",x:26,y:37},{g:"A",l:"A2",x:76,y:22}]}
};

/* Standaard-speelsters (uit Level Up). Posities: V, M, A, MA (middenveld én aanval), K (keeper) */
const STD_SPEELSTERS=[
  ["charlotte","Charlotte","K"],
  ["veerle","Veerle","V"],["ella","Ella","V"],["elise","Elise","V"],["june","June","V"],["jinte","Jinte","V"],
  ["riva","Riva","MA"],["dante","Dante","MA"],["bo","Bo","MA"],["tess","Tess","MA"],
  ["lillemor","Lillemor","MA"],["emma","Emma","MA"],["rosalie","Rosalie","MA"],["annemijn","Annemijn","MA"]
].map(([id,naam,pos])=>({id,naam,pos}));

/* =====================================================================
   OPSLAG — op eikenlaan-webapps.nl: Supabase-tabel zaal_mo12_data
   (één rij per onderdeel). Elders (voorbeeld): alleen in deze browser.
   ===================================================================== */
const SB_URL="https://hvpooifxqhovskwgzpbr.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2cG9vaWZ4cWhvdnNrd2d6cGJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MzQ1MzQsImV4cCI6MjA5NzAxMDUzNH0.zM3vFf6RB7uE4QoLP2uYdPe2AMI9NPJPFWqxQ_M2A3g";
const TABEL="zaal_mo12_data";
const LIVE=/eikenlaan-webapps\.nl$/.test(location.hostname);
let sb=null; if(LIVE){try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}}
const LS="zaal-mo12-1-voorbeeld";
const KEYS=["speelsters","beschikbaarheid","uitslagen","opstellingen","instellingen"];
let S={
  speelsters:STD_SPEELSTERS,
  beschikbaarheid:{},          // {spelerId:{dag:"nee"|"w1"|"w2"}}  (ontbreekt = aanwezig)
  uitslagen:{},                // {wedstrijdId:[thuis,uit]}
  opstellingen:{},             // {wedstrijdId:{form,t1:[5 ids],t2:[5 ids],tr:[ids]}} — vastgezet
  instellingen:{form:"huis",maSamen:true,blok:[6,7,7],perWed:{}}  // perWed: {wedstrijdId:"huis"|"dobbel"}
};
let ADMIN=!LIVE;   // voorbeeld: alles bewerkbaar
async function laad(){
  if(LIVE&&sb){
    try{
      const r=await sb.from(TABEL).select("id,data");
      if(!r.error&&r.data) r.data.forEach(x=>{ if(KEYS.includes(x.id)&&x.data) S[x.id]=x.data; });
      const s=await sb.auth.getSession();
      if(s.data&&s.data.session){ const q=await sb.rpc("mijn_rol"); ADMIN=q.data==="admin"; }
    }catch(e){}
  }else{
    try{ const raw=localStorage.getItem(LS); if(raw){ const o=JSON.parse(raw); KEYS.forEach(k=>{ if(o[k]) S[k]=o[k]; }); } }catch(e){}
  }
  S.instellingen={form:"huis",maSamen:true,blok:[6,7,7],perWed:{},...S.instellingen};
  if(!S.instellingen.koppels) S.instellingen.koppels=[{a:"riva",b:"dante",per:{"d7-3":"hard"}}];
}
let saveMsg="";
async function bewaar(...keys){
  if(LIVE){
    if(!sb||!ADMIN) return;
    const rows=keys.map(k=>({id:k,data:S[k],bijgewerkt:new Date().toISOString()}));
    const r=await sb.from(TABEL).upsert(rows,{onConflict:"id"});
    if(r.error){ try{alert("Opslaan mislukt: "+r.error.message)}catch(_){} }
  }else{
    try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
  }
}

/* =====================================================================
   VERDELING — wie speelt wanneer, zo gelijk mogelijk
   ===================================================================== */
const veld=()=>S.speelsters.filter(p=>p.pos!=="K");
const keeper=()=>S.speelsters.find(p=>p.pos==="K");
const naam=id=>(S.speelsters.find(p=>p.id===id)||{naam:"?"}).naam;
const formVan=m=>S.instellingen.perWed[m.id]||S.instellingen.form;
const minPerBeurt=()=>S.instellingen.blok.reduce((a,b)=>a+(+b||0),0);
function aanwezig(pid,m){
  const s=(S.beschikbaarheid[pid]||{})[m.dag];
  if(s==="nee") return false;
  if(s==="w1") return m.ihDag===0;
  if(s==="w2") return m.ihDag===1;
  return true;
}
// welke groep vult een slot? Bij M+A samen worden M en A één groep "MA"
const slotGroep=g=>S.instellingen.maSamen&&g!=="V"?"MA":g;
function past(p,grp){
  if(grp==="V") return p.pos==="V";
  if(grp==="MA") return p.pos==="M"||p.pos==="A"||p.pos==="MA";
  if(grp==="M") return p.pos==="M"||p.pos==="MA";
  if(grp==="A") return p.pos==="A"||p.pos==="MA";
  return false;
}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}

/* Koppels: twee speelsters samen in hetzelfde team. Per wedstrijd: "hard" (verplicht), "zacht" (als het kan, standaard) of "los" */
const koppels=()=>S.instellingen.koppels||[];
const kMode=(k,m)=>(k.per&&k.per[m.id])||"zacht";
const koppelActief=(id,m)=>koppels().some(k=>(k.a===id||k.b===id)&&kMode(k,m)!=="los"&&aanwezig(k.a,m)&&aanwezig(k.b,m));
function maakPlan(){
  const spelers=veld(), P={}, beurt={};
  spelers.forEach(p=>beurt[p.id]=0);
  const tel=(ids,d=1)=>ids.forEach(id=>{ if(id in beurt) beurt[id]+=d; });
  // 1. vastgezette opstellingen tellen eerst mee
  RW.forEach(m=>{ const v=S.opstellingen[m.id]; if(v){ P[m.id]={...v,vast:true,gespeeld:!!S.uitslagen[m.id]}; tel([...v.t1,...v.t2]); } });
  const open=RW.filter(m=>!P[m.id]);
  const gem=open.length? open.reduce((s,m)=>s+10/Math.max(10,spelers.filter(p=>aanwezig(p.id,m)).length),0)/open.length : 0.77;
  // 2. open wedstrijden chronologisch vullen
  open.forEach((m,oi)=>{
    const beschik=spelers.filter(p=>aanwezig(p.id,m));
    const toekomst={}; beschik.forEach(p=>toekomst[p.id]=open.slice(oi+1).filter(x=>aanwezig(p.id,x)).length);
    const zus=RW.find(x=>x.dag===m.dag&&x!==m&&x.ihDag<m.ihDag);   // eerdere wedstrijd zelfde dag
    const zatZus=id=>zus&&P[zus.id]&&P[zus.id].tr.includes(id);
    const score=p=>beurt[p.id]+gem*toekomst[p.id]-(zatZus(p.id)?0.6:0)+(hash(p.id+m.id)%100)/1000;
    const F=FORM[formVan(m)], nodig={};
    F.slots.forEach(s=>{const g=slotGroep(s.g); nodig[g]=(nodig[g]||0)+2;});
    const gekozen={}, flex=[];
    const vrij=()=>beschik.filter(p=>!Object.values(gekozen).flat().includes(p.id));
    ["V","A","M","MA"].filter(g=>nodig[g]).forEach(g=>{
      let kand=vrij().filter(p=>past(p,g)).sort((a,b)=>score(a)-score(b)).slice(0,nodig[g]);
      if(kand.length<nodig[g]){ // tekort in deze linie: aanvullen uit andere linies
        const extra=vrij().filter(p=>!kand.includes(p)).sort((a,b)=>score(a)-score(b)).slice(0,nodig[g]-kand.length);
        extra.forEach(p=>flex.push(p.id)); kand=kand.concat(extra);
      }
      // koppels: beide spelen of beide niet (verplicht: beide spelen)
      const gesort=vrij().filter(p=>past(p,g)).sort((a,b)=>score(a)-score(b)), n=nodig[g];
      koppels().forEach(k=>{
        const mode=kMode(k,m); if(mode==="los") return;
        const A=gesort.find(p=>p.id===k.a), B=gesort.find(p=>p.id===k.b);
        if(!A||!B||n<2) return;
        const rest=gesort.filter(p=>p!==A&&p!==B);
        const met=[A,B,...rest.slice(0,n-2)], zonder=rest.slice(0,n);
        const som=l=>l.reduce((x,p)=>x+score(p),0);
        if(mode==="hard"||zonder.length<n||som(met)<=som(zonder)) kand=met; else kand=zonder;
      });
      gekozen[g]=kand.map(p=>p.id);
    });
    // verdelen over team 1 en 2 (afwisselend, roterend per wedstrijd)
    const t1=[],t2=[], rot=m.nr%2;
    const perTeam={}; F.slots.forEach(s=>{const g=slotGroep(s.g);(perTeam[g]=perTeam[g]||[]).push(s)});
    Object.keys(gekozen).forEach(g=>{
      const ids=gekozen[g], a=[],b=[];
      ids.forEach((id,i)=>((i+rot)%2?b:a).push(id));
      gekozen[g]={a,b};
    });
    F.slots.forEach((s,i)=>{
      const g=slotGroep(s.g), q=gekozen[g]||{a:[],b:[]};
      t1[i]=q.a.shift()||null; t2[i]=q.b.shift()||null;
    });
    // te weinig speelsters: lege plekken vullen met iemand uit het andere team (speelt dubbel)
    const dubbel=[];
    [[t1,t2],[t2,t1]].forEach(([x,y])=>x.forEach((id,i)=>{
      if(id) return;
      const kies=y.filter(z=>z&&!x.includes(z)).sort((p,q)=>beurt[p]-beurt[q])[0];
      if(kies){x[i]=kies;dubbel.push(kies);}
    }));
    // koppel in verschillende teams: partner ruilen met een teamgenoot op een plek van dezelfde linie
    koppels().forEach(k=>{
      if(kMode(k,m)==="los") return;
      const ia=t1.indexOf(k.a), ib=t2.indexOf(k.b), ja=t2.indexOf(k.a), jb=t1.indexOf(k.b);
      const [thuis,weg,pid]= ia>=0&&ib>=0?[t1,t2,k.b]: ja>=0&&jb>=0?[t2,t1,k.b]:[null];
      if(!thuis) return;
      const pi=weg.indexOf(pid), g=slotGroep(F.slots[pi].g);
      const j=thuis.findIndex((x,i)=>x&&x!==k.a&&slotGroep(F.slots[i].g)===g&&!koppels().some(q=>q.a===x||q.b===x));
      if(j<0) return;
      const x=thuis[j]; thuis[j]=pid; weg[pi]=x;
    });
    const inVeld=new Set([...t1,...t2].filter(Boolean));
    const tr=beschik.filter(p=>!inVeld.has(p.id)).map(p=>p.id);
    P[m.id]={form:formVan(m),t1,t2,tr,flex,dubbel,vast:false,gespeeld:false};
    tel([...t1,...t2].filter(Boolean));
  });
  // 3. bijschaven: ruil veld ↔ tribune zolang het verschil 2 beurten of meer is
  for(let ronde=0;ronde<60;ronde++){
    let geruild=false;
    for(const m of open){
      const p=P[m.id], F=FORM[p.form];
      const zus=RW.find(x=>x.dag===m.dag&&x!==m);
      for(const t of ["t1","t2"]) for(let i=0;i<5;i++){
        const x=p[t][i]; if(!x||p.dubbel.includes(x)||koppelActief(x,m)) continue;
        const g=slotGroep(F.slots[i].g);
        const kand=p.tr.filter(y=>!koppelActief(y,m)&&past(S.speelsters.find(s=>s.id===y),g)&&beurt[x]-beurt[y]>=2)
          .sort((a,b)=>beurt[a]-beurt[b]);
        for(const y of kand){
          const xZitAl=zus&&P[zus.id]&&P[zus.id].tr.includes(x);
          if(xZitAl&&kand.length>1&&y!==kand[kand.length-1]) continue;
          p[t][i]=y; p.tr=p.tr.filter(z=>z!==y).concat(x); beurt[x]--; beurt[y]++; geruild=true; break;
        }
      }
    }
    if(!geruild) break;
  }
  return P;
}
let PLAN={};
function herbereken(){ PLAN=maakPlan(); }

function speeltijd(){
  const mpb=minPerBeurt(), r={};
  veld().forEach(p=>r[p.id]={id:p.id,naam:p.naam,pos:p.pos,gesp:0,gepl:0,wGesp:0,wGepl:0,trib:0,afw:0});
  RW.forEach(m=>{
    const p=PLAN[m.id]; if(!p) return;
    const gespeeld=!!S.uitslagen[m.id];
    [...p.t1,...p.t2].filter(Boolean).forEach(id=>{ if(!r[id])return;
      if(gespeeld){r[id].gesp+=mpb;} else {r[id].gepl+=mpb;} });
    new Set([...p.t1,...p.t2].filter(Boolean)).forEach(id=>{ if(!r[id])return; gespeeld?r[id].wGesp++:r[id].wGepl++; });
    p.tr.forEach(id=>{ if(r[id]) r[id].trib++; });
    veld().forEach(s=>{ if(!aanwezig(s.id,m)) r[s.id].afw++; });
  });
  return Object.values(r);
}

  const m=RW.find(x=>x.id===id), p=PLAN[id], u=S.uitslagen[id], F=FORM[p.form];
  const thuis=m.h===WIJ, kp=keeper();
  const kpWeg=kp&&!aanwezig(kp.id,m);
  const weg=veld().filter(s=>!aanwezig(s.id,m)).map(s=>s.id);
  const team=p[TEAMSEL];
  const tok=(sid,s,i)=>{ if(!sid) return `<span class="tok ${TEAMSEL}" style="left:${s.x}%;top:${s.y}%"><i>?</i><b>leeg</b></span>`;
    const sel=RUIL&&RUIL.t===TEAMSEL&&RUIL.i===i;
    return `<button class="tok ${TEAMSEL}${sel?" sel":""}" style="left:${s.x}%;top:${s.y}%" data-act="ruil" data-t="${TEAMSEL}" data-i="${i}" ${ADMIN&&!u?"":"disabled"}><i>${s.l}</i><b>${esc(naam(sid))}</b>${p.dubbel&&p.dubbel.includes(sid)?'<span class="d">speelt dubbel</span>':""}${p.flex&&p.flex.includes(sid)?'<span class="d">andere linie</span>':""}</button>`;};
  const b=S.instellingen.blok, eind=[0,1,2].map(i=>b.slice(0,i+1).reduce((x,y)=>x+(+y),0));
  const seq=(volg)=>`<div class="seq">${volg.map((t,i)=>`<div class="s${t}" style="flex:${b[i]}">Team ${t}<small>${i?eind[i-1]:0}'–${eind[i]}'</small></div>`).join("")}</div>`;
  let h=`<button class="back" data-act="terug">‹ Terug</button>
  <div class="mhead"><div class="meta">Wedstrijd ${m.nr} van ${RW.length} · ${fdat(m.datum,1)} · ${m.t} · ${thuis?"Thuis":"Uit"}</div>
    <div class="vs"><div class="tm">${badge(m.h)}${tnaam(m.h)}</div>
      <div class="sc${u?"":" leeg"}">${u?`${u[0]} – ${u[1]}`:m.t}</div>
      <div class="tm">${badge(m.a)}${tnaam(m.a)}</div></div>
    ${ADMIN?`<div class="flex" style="justify-content:center;margin-top:12px"><button class="btn sm" data-act="score" data-id="${m.id}">${u?"Uitslag wijzigen":"Uitslag invullen"}</button>${p.vast&&!u?`<button class="btn sec2 sm" data-act="vrij" data-id="${m.id}">Terug naar automatisch</button>`:""}</div>`:""}
  </div>`;
  if(!u&&ADMIN) h+=`<div class="seg">${Object.entries(FORM).map(([k,f])=>`<button class="${p.form===k?"on":""}" data-act="wform" data-v="${k}">${f.naam}</button>`).join("")}</div>`;
  else h+=`<p class="muted" style="text-align:center;margin:12px 0 0">Opstelling: ${F.naam}</p>`;
  if(ADMIN&&!u) koppels().forEach((k,ki)=>{ if(!aanwezig(k.a,m)||!aanwezig(k.b,m)) return; const md=kMode(k,m);
    h+=`<div class="muted" style="margin:12px 4px 0">${esc(naam(k.a))} &amp; ${esc(naam(k.b))} in één team</div><div class="seg">${[["hard","Verplicht"],["zacht","Als het kan"],["los","Los"]].map(([v,l])=>`<button class="${md===v?"on":""}" data-act="kmode" data-k="${ki}" data-v="${v}">${l}</button>`).join("")}</div>`; });
  h+=`<div class="seg ${TEAMSEL}"><button class="b1 ${TEAMSEL==="t1"?"on":""}" data-act="team" data-v="t1">Team 1 · start</button><button class="b2 ${TEAMSEL==="t2"?"on":""}" data-act="team" data-v="t2">Team 2</button></div>
  <div class="court">${courtSVG()}
    ${F.slots.map((s,i)=>tok(team[i],s,i)).join("")}
    ${kp?`<span class="tok k" style="left:50%;top:91%"><i>K</i><b>${esc(kp.naam)}</b></span>`:""}
  </div>`;
  if(kpWeg) h+=`<div class="warn">${esc(kp.naam)} is afwezig. Regel een vervangende keeper.</div>`;
  if(p.vast&&!u) h+=`<div class="warn">Handmatig aangepast. Deze opstelling blijft staan bij herberekenen.</div>`;
  if(RUIL) h+=`<div class="warn">Kies hieronder met wie ${esc(naam(p[RUIL.t][RUIL.i]))} ruilt, of tik op een speelster in het veld.</div>`;
  const ander=TEAMSEL==="t1"?"t2":"t1";
  h+=`<div class="sec">Tribune</div><div class="card"><div class="chips">${p.tr.length?p.tr.map(x=>`<button class="chip" data-act="ruilmet" data-v="tr:${x}" ${RUIL?"":"disabled"}>${esc(naam(x))}</button>`).join(""):'<span class="muted">Niemand</span>'}
    ${weg.map(x=>`<span class="chip weg">${esc(naam(x))} · afwezig</span>`).join("")}</div></div>`;
  if(RUIL) h+=`<div class="sec">Of ruil met team ${ander==="t1"?1:2}</div><div class="card"><div class="chips">${p[ander].filter(Boolean).map((x,i)=>`<button class="chip" data-act="ruilmet" data-v="${ander}:${p[ander].indexOf(x)}">${esc(naam(x))} · ${F.slots[p[ander].indexOf(x)].l}</button>`).join("")}</div></div>`;
  h+=`<div class="sec">Wisselschema</div><div class="card tl">
    <div class="hl">1e helft</div>${seq([1,2,1])}
    <div class="hl">2e helft</div>${seq([2,1,2])}
    <p class="muted" style="margin:10px 0 0">Team 1: ${p.t1.filter(Boolean).map(naam).join(", ")}<br>Team 2: ${p.t2.filter(Boolean).map(naam).join(", ")}</p></div>`;
  if(ADMIN&&!u) h+=`<p class="muted" style="margin:10px 4px">Tik op een speelster in het veld om te ruilen. Die wedstrijd wordt daarna vastgezet; de wedstrijden erna worden opnieuw verdeeld.</p>`;
  return h;
}

/* ---------- Sheets ---------- */
function sheetScore(id){
  const m=WED.find(x=>x.id===id), u=S.uitslagen[id]||["",""];
  $("sheet").innerHTML=`<div class="sheet" data-act="sluit"><div>
    <h3>Uitslag</h3><div class="muted">${fdat(m.datum,1)} · ${m.t}</div>
    <div class="scorein"><span class="h">${tnaam(m.h)}</span><input class="in" id="sH" type="number" min="0" inputmode="numeric" value="${u[0]}"><span>–</span><input class="in" id="sA" type="number" min="0" inputmode="numeric" value="${u[1]}"><span class="a">${tnaam(m.a)}</span></div>
    <div class="flex"><button class="btn" data-act="scoreok" data-id="${id}">Opslaan</button>${S.uitslagen[id]?`<button class="btn sec2" data-act="scorewis" data-id="${id}">Uitslag wissen</button>`:""}<button class="btn sec2" data-act="sluit">Annuleren</button></div>
    ${(m.h===WIJ||m.a===WIJ)?'<p class="muted">Met een uitslag telt deze wedstrijd als gespeeld en ligt de opstelling vast.</p>':""}
  </div></div>`;
}

/* =====================================================================
   ACTIES
   ===================================================================== */
async function wijzig(keys){ herbereken(); render(); await bewaar(...keys); }
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-tab],[data-act]"); if(!el) return;
  if(el.dataset.tab){ TAB=el.dataset.tab; OPEN=null; RUIL=null; render(); return; }
  const a=el.dataset.act, d=el.dataset;
  if(a==="filter"){ ALLEEN_WIJ=d.v==="1"; render(); }
  else if(a==="open"){ OPEN=d.id; TEAMSEL="t1"; RUIL=null; render(); window.scrollTo(0,0); }
  else if(a==="terug"){ OPEN=null; RUIL=null; render(); }
  else if(a==="team"){ TEAMSEL=d.v; render(); }
  else if(a==="score"){ if(ADMIN) sheetScore(d.id); }
  else if(a==="sluit"){ if(e.target===el) $("sheet").innerHTML=""; }
  else if(a==="scoreok"){
    const x=$("sH").value, y=$("sA").value; if(x===""||y===""){ return; }
    const id=d.id; S.uitslagen[id]=[+x,+y];
    const keys=["uitslagen"];
    if(PLAN[id]&&!S.opstellingen[id]){ const p=PLAN[id]; S.opstellingen[id]={form:p.form,t1:p.t1,t2:p.t2,tr:p.tr}; keys.push("opstellingen"); }
    $("sheet").innerHTML=""; await wijzig(keys);
  }
  else if(a==="scorewis"){ delete S.uitslagen[d.id]; $("sheet").innerHTML=""; await wijzig(["uitslagen"]); }
  else if(a==="besch"){
    const p=d.p, dag=+d.d, cur=(S.beschikbaarheid[p]||{})[dag]||"ja";
    const nxt=BS[(BS.findIndex(b=>b[0]===cur)+1)%BS.length][0];
    S.beschikbaarheid[p]=S.beschikbaarheid[p]||{};
    if(nxt==="ja") delete S.beschikbaarheid[p][dag]; else S.beschikbaarheid[p][dag]=nxt;
    // handmatig vastgezette, nog niet gespeelde opstellingen op die dag laten vervallen als de speelster er in stond
    RW.filter(m=>m.dag===dag&&!S.uitslagen[m.id]&&S.opstellingen[m.id]).forEach(m=>{ const v=S.opstellingen[m.id];
      if([...v.t1,...v.t2,...v.tr].includes(p)) delete S.opstellingen[m.id]; });
    await wijzig(["beschikbaarheid","opstellingen"]);
  }
  else if(a==="ruil"){
    const t=d.t,i=+d.i;
    if(RUIL&&RUIL.t===t&&RUIL.i===i){ RUIL=null; render(); return; }
    if(RUIL){ await doeRuil(`${t}:${i}`); return; }
    RUIL={t,i}; render();
  }
  else if(a==="ruilmet"){ if(RUIL) await doeRuil(d.v); }
  else if(a==="vrij"){ delete S.opstellingen[d.id]; delete S.instellingen.perWed[d.id]; await wijzig(["opstellingen","instellingen"]); }
  else if(a==="wform"){
    const p=PLAN[OPEN]; S.instellingen.perWed[OPEN]=d.v;
    if(S.opstellingen[OPEN]){ S.opstellingen[OPEN].form=d.v; }
    await wijzig(["instellingen","opstellingen"]);
  }
  else if(a==="kmode"){ const k=koppels()[+d.k]; k.per=k.per||{}; if(d.v==="zacht") delete k.per[OPEN]; else k.per[OPEN]=d.v;
    if(S.opstellingen[OPEN]&&!S.uitslagen[OPEN]) delete S.opstellingen[OPEN]; await wijzig(["instellingen","opstellingen"]); }
  else if(a==="kdel"){ S.instellingen.koppels.splice(+d.k,1); await wijzig(["instellingen"]); }
  else if(a==="kadd"){ const x=$("kA").value,y=$("kB").value; if(x===y||koppels().some(k=>[k.a,k.b].includes(x)||[k.a,k.b].includes(y))) return;
    S.instellingen.koppels=[...koppels(),{a:x,b:y,per:{}}]; await wijzig(["instellingen"]); }
  else if(a==="form"){ S.instellingen.form=d.v; await wijzig(["instellingen"]); }
  else if(a==="masamen"){ S.instellingen.maSamen=!S.instellingen.maSamen; await wijzig(["instellingen"]); }
  else if(a==="padd"){ const n=($("nieuw")||{}).value; if(!n||!n.trim()) return;
    let id=n.toLowerCase().replace(/[^a-z0-9]/g,"")||"sp"; while(S.speelsters.some(p=>p.id===id)) id+="x";
    S.speelsters=[...S.speelsters,{id,naam:n.trim(),pos:"MA"}]; await wijzig(["speelsters"]); }
  else if(a==="reset"){ if(ARM!=="reset"){ARM="reset";render();return;} ARM=null;
    Object.keys(S.opstellingen).forEach(k=>{ if(!S.uitslagen[k]) delete S.opstellingen[k]; }); S.instellingen.perWed={}; await wijzig(["opstellingen","instellingen"]); }
  else if(a==="wis"){ if(ARM!=="wis"){ARM="wis";render();return;} ARM=null; try{localStorage.removeItem(LS)}catch(_){} location.reload(); }
});
document.addEventListener("change",async e=>{
  const el=e.target, d=el.dataset; if(!d.act) return;
  if(d.act==="blok"){ S.instellingen.blok[+d.i]=Math.max(1,Math.min(20,+el.value||1)); await wijzig(["instellingen"]); }
  else if(d.act==="pnaam"){ const p=S.speelsters.find(x=>x.id===d.p); if(p&&el.value.trim()){ p.naam=el.value.trim(); await wijzig(["speelsters"]); } }
  else if(d.act==="ppos"){ const p=S.speelsters.find(x=>x.id===d.p); if(p){ p.pos=el.value; Object.keys(S.opstellingen).forEach(k=>{ if(!S.uitslagen[k]) delete S.opstellingen[k]; }); await wijzig(["speelsters","opstellingen"]); } }
});
async function doeRuil(doel){
  const p=PLAN[OPEN], v={form:p.form,t1:[...p.t1],t2:[...p.t2],tr:[...p.tr]};
  const a=v[RUIL.t][RUIL.i];
  const [t,ix]=doel.split(":");
  if(t==="tr"){ const b=ix; v[RUIL.t][RUIL.i]=b; v.tr=v.tr.filter(x=>x!==b).concat(a); }
  else { const i=+ix, b=v[t][i]; v[t][i]=a; v[RUIL.t][RUIL.i]=b; }
  S.opstellingen[OPEN]=v; RUIL=null; await wijzig(["opstellingen"]);
}

(async()=>{ await laad(); herbereken(); render(); })();
</script>
